[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "graviton"
version = "1.0.0"
description = "Graviton + TrustLedger: Post-Quantum Identity, E2EE Storage/Chat, and Explainable Detection"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pqcrypto>=0.4.0",
    "cryptography>=43.0.0",
    "reedsolo>=1.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-timeout>=2.3.0",
    "hypothesis>=6.100.0",
]

[project.scripts]
gt = "graviton_cli:main"
graviton = "graviton_cli:main"
trustledger = "trustledger.cli:main"

[tool.setuptools]
py-modules = ["graviton_cli", "team_app", "track4_service"]

[tool.setuptools.packages.find]
include = ["trustledger*"]
