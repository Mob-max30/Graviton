name: Graviton CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux-pqcrypto-only:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Graviton
        uses: actions/checkout@v4
        with:
          path: Graviton

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install only requirements.txt (pqcrypto==0.4.0)
        working-directory: Graviton
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify imports without cryptography
        working-directory: Graviton
        run: |
          python -c "import graviton, graviton.crypto, graviton.feed, graviton.nodes, graviton.harness, track4_service"

      - name: Run full unittest suite (exercises fcntl.flock & POSIX modes)
        working-directory: Graviton
        run: |
          python -m unittest discover -s tests -v

      - name: Clone Track-4-Toolkit and run validate.py
        run: |
          git clone --depth 1 https://github.com/ScalerOpenSourceLabs/Track-4-Toolkit Track-4-Toolkit
          cd Track-4-Toolkit
          python validate.py --entry "../Graviton/track4_service.py"

      - name: Run Phase 3 multi-node harness on Linux
        working-directory: Graviton
        run: |
          python -m graviton.harness --scenario all --nodes 5 --delay-ms 0:50 --seed 1

  linux-with-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Graviton
        uses: actions/checkout@v4
        with:
          path: Graviton

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install core + app extra (pqcrypto==0.4.0 + cryptography==50.0.2)
        working-directory: Graviton
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt cryptography==50.0.2

      - name: Run Stage 1, 3, 4, 5, and 6 engine tests on Linux
        working-directory: Graviton
        run: |
          python -m unittest tests/engine/test_stage1_node_daemon.py tests/engine/test_stage3_membership.py tests/engine/test_stage4_data_plane.py tests/engine/test_stage5_sentinel_redteam.py tests/engine/test_stage6_packaging_demo.py -v

      - name: Run 30-run revocation probe and upload artifact
        working-directory: Graviton
        run: |
          python -c "import base64, json, secrets, tempfile; from pathlib import Path; from graviton.admin import AdminManager; from graviton.cluster import cluster_up, cluster_down; from graviton.crypto.keystore import load_keystore; from graviton.probe import run_revocation_probe; tmp = Path(tempfile.mkdtemp()); pw = secrets.token_hex(12); adm = AdminManager(tmp/'adm'); g = adm.init_group('ci-probe', pw); apk = base64.b64decode(adm._load_state()['admin_pk_b64']); c = cluster_up(tmp/'cls', 3, g['feed_id'], apk, sync_interval_s=0.1, initial_entries=[bytes.fromhex(h) for h in adm._load_state()['entries_hex']]); [adm.add_node(n['host'], int(n['port'])) for n in c['nodes']]; [adm.register_key(n['node_id'], n['node_id'], base64.b64decode(n['node_pk_b64']), pw) for n in c['nodes'][1:]]; _, _, ask = load_keystore(adm.keystore_path, pw); res = run_revocation_probe(c, ask, runs=30, poll_interval_s=0.05); Path('probe_results.json').write_text(json.dumps(res, indent=2)); cluster_down(tmp/'cls')"

      - name: Upload probe results artifact
        uses: actions/upload-artifact@v4
        with:
          name: revocation-probe-results
          path: Graviton/probe_results.json
